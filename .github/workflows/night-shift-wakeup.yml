name: Wolf Factory Night Shift Wakeup
on:
  workflow_dispatch:
  schedule:
    - cron: '23 0-6 * * *'
permissions:
  contents: read
concurrency:
  group: wolf-night-shift-bootstrap
  cancel-in-progress: false
jobs:
  existing-factory:
    if: github.event.repository.private == false && github.repository == 'insidethemarginmedia-cpu/wolf-factory-home' && github.actor == 'insidethemarginmedia-cpu'
    permissions:
      contents: write
      actions: read
    uses: insidethemarginmedia-cpu/wolf-factory-home/.github/workflows/private-controller-preflight.yml@961f7e75e1a0aa3a5191641edd7613d6dde6c729
    with:
      public_runtime_sha: 961f7e75e1a0aa3a5191641edd7613d6dde6c729
      night_shift: true
    secrets:
      WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
      WOLF_FACTORY_DEPLOY_KEY: ${{ secrets.WOLF_FACTORY_DEPLOY_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BOXXKITE_API_KEY: ${{ secrets.BOXXKITE_API_KEY }}
