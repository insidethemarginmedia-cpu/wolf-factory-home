          fs.writeFileSync(path.join(root,'.continuity/memory/founder_directives.md'),'EUR_SPEND=0\nCOST_UNKNOWN=DENY\nFOUNDER_INTERVENTIONS=0\nFOUNDER_REPETITIONS=0\nUNKNOWN=>CLOSED\n');
          fs.writeFileSync(path.join(root,'.continuity/memory/current_state.md'),'# Synthetic integrated acceptance\n');
          for(const file of ['task_queue.json','completed_tasks.json'])fs.writeFileSync(path.join(root,'.continuity/tasks',file),'[]\n');
          const run=process.env.GITHUB_RUN_ID;
          const test=(expression)=>"import importlib.util\nfrom pathlib import Path\ns=importlib.util.spec_from_file_location('candidate',Path(__file__).with_name('candidate.py'))\nm=importlib.util.module_from_spec(s);s.loader.exec_module(m)\n"+expression+'\n';
          const missions=[{taskId:'OMEGA_A_'+run,target:'docs/factory-acceptance/omega-'+run+'-a.py',fixtureSource:'def add(a,b):\n    return a-b\n',requirement:'add(a,b) must return the arithmetic sum of the two integers.',testSource:test('assert m.add(2,3)==5\nassert m.add(-3,2)==-1'),independentSource:test('for a in range(-5,6):\n for b in range(-5,6): assert m.add(a,b)==a+b')},{taskId:'OMEGA_B_'+run,target:'docs/factory-acceptance/omega-'+run+'-b.py',fixtureSource:'def normalize(value):\n    return value.strip()\n',requirement:'normalize(value) strips whitespace, collapses every run of internal whitespace into a single space, and lowercases text.',testSource:test("assert m.normalize(' A  B ')=='a b'\nassert m.normalize(' HeLLo ')=='hello'"),independentSource:test("assert m.normalize('')==''\nassert m.normalize(' A\\tB\\n C ')=='a b c'\nassert m.normalize(' X ')==m.normalize(m.normalize(' X '))")}];
          fs.writeFileSync(process.env.WOLF_FACTORY_ACCEPTANCE_MANIFEST,JSON.stringify({baseSha:process.env.WOLF_FACTORY_EXPECTED_SHA,workflowID:'wolf-omega-integrated-'+run,requireIntegratedReview:true,restartAfterMissionA:true,missions}));
          NODE
      - name: Materialize the reserved self-repair in the existing canonical inbox
        if: inputs.night_shift == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: 'node scripts/wolf-night-shift-wakeup.mjs materialize
      
          git switch -c feat/factory-real-worker-m1-20261006
      
          git remote set-url origin git@github.com:donraposo1-source/project-wolf.git'
      - name: Verify authorized branch publication with no ref update
        if: inputs.execute_integrated == true || inputs.night_shift == true
        env:
          WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          const p=spawnSync('git',['push','--dry-run','origin','HEAD:refs/heads/feat/factory-real-worker-m1-20261006'],{encoding:'utf8',timeout:30000,env:{...process.env,GIT_TERMINAL_PROMPT:'0'}});
          const text=String(p.stderr||'');
          const safe=text.replace(/https?:\/\/[^\s]+/g,'[REDACTED_URL]').replace(/(?:gh[pousr]_|github_pat_)[A-Za-z0-9_]+/g,'[REDACTED_TOKEN]').split(process.env.WOLF_FACTORY_REPO_TOKEN||'\0').join('[REDACTED_TOKEN]').slice(0,4000);
          console.log('WOLF_GIT_ORIGINAL_ERROR='+JSON.stringify({stderr:safe,signal:p.signal,errorCode:p.error?.code}));
          const reason=/403|write access.*not granted|permission.*denied|authentication failed/i.test(text)?'WRITE_ACCESS_DENIED':/shallow/i.test(text)?'SHALLOW_HISTORY_DENIED':/non-fast-forward|fetch first|tip of your current branch is behind|rejected/i.test(text)?'CONCURRENT_BRANCH_ADVANCED':p.status===0?'AUTHORIZED':'GIT_PUBLICATION_PREFLIGHT_FAILED';
          console.log('WOLF_GIT_PUBLICATION_DRY_RUN='+JSON.stringify({exitCode:p.status,reason,refUpdated:false}));
          if(p.status!==0)throw Error(reason);
          NODE
      - name: Execute Mission A then restart existing controller for automatic Mission B
        if: inputs.execute_integrated == true
        env:
          WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BOXXKITE_API_KEY: ${{ secrets.BOXXKITE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          WOLF_RESIDENT_MODE=dbos-engineering node infra/autonomy/resident-entrypoint.mjs > "$RUNNER_TEMP/wolf-first.log" 2>&1
          rc=$?
