name: Private Controller Access Preflight
on:
  workflow_dispatch:
    inputs:
      verify_private_source:
        description: Verify private source authorization only, without fetching source
        type: boolean
        default: false
      verify_private_checkout:
        description: Read-only private checkout at pinned source SHA, no inference or publication
        type: boolean
        default: false
      verify_dbos_runtime:
        description: Run existing private DBOS crash-recovery fixture in an isolated read-only runner
        type: boolean
        default: false
      execute_integrated:
        description: Execute existing Factory synthetic missions A and B with correlated review and controller restart
        type: boolean
        default: false
      qualify_opencode:
        description: Qualify real OpenCode and existing Cezar process lifecycle without inference
        type: boolean
        default: false
      qualify_worker:
        description: Run a bounded free inference qualification
        type: boolean
        default: false
  push:
    branches: [feat/public-runtime-probe-20261022]
    paths:
      - '.github/workflows/private-controller-preflight.yml'
      - 'scripts/private-controller-preflight.mjs'
      - 'scripts/private-source-authorization.mjs'
      - 'tests/private-source-authorization.test.mjs'
      - 'tests/private-controller-preflight.test.mjs'
      - 'scripts/existing-worker-qualification.mjs'
      - 'tests/existing-worker-qualification.test.mjs'
      - 'scripts/boxxkite-service-diagnostic.mjs'
      - 'tests/boxxkite-service-diagnostic.test.mjs'
permissions:
  contents: read
concurrency:
  group: private-controller-preflight
  cancel-in-progress: false
jobs:
  security-tests:
    if: github.repository == 'insidethemarginmedia-cpu/wolf-factory-home' && github.actor == 'insidethemarginmedia-cpu'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - run: node --test tests/*.test.mjs
  dbos-runtime:
    needs: security-tests
    if: github.event_name == 'workflow_dispatch' && inputs.verify_dbos_runtime == true && github.repository == 'insidethemarginmedia-cpu/wolf-factory-home' && github.ref == 'refs/heads/feat/public-runtime-probe-20261022' && github.actor == 'insidethemarginmedia-cpu'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dbos
          POSTGRES_DB: wolf_factory_dbos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wolf_factory_dbos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DBOS_SHA: 3f36908f58fd8b3079cbf5372203c7a2d0ba06cc
      WOLF_DBOS_SYSTEM_DATABASE_URL: postgresql://postgres:dbos@localhost:5432/wolf_factory_dbos
      WOLF_DBOS_FIXTURE_ROOT: /tmp/wolf-factory-dbos-e2e
      WOLF_DBOS_SDK_ENTRYPOINT: /tmp/dbos/dist/src/index.js
      EUR_SPEND: '0'
      COST_UNKNOWN: DENY
      PAID_FALLBACK: DENY
      TRIAL_CREDIT: DENY
    steps:
      - name: Checkout private Factory at verified immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: donraposo1-source/project-wolf
          ref: ff0a29aae8179d9c4a0c57d5772ae58f282c5ea6
          token: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Assert immutable source and recovery fixture
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'ff0a29aae8179d9c4a0c57d5772ae58f282c5ea6'
          test -f scripts/wolf-dbos-outer-e2e.mjs
          test -f scripts/wolf-factory-boxxkite-acceptance.mjs
          test -z "$(git status --porcelain)"
          echo PRIVATE_FACTORY_DBOS_SOURCE_VERIFIED=YES
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install private Factory lockfile dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Checkout pinned DBOS SDK donor
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/dbos-inc/dbos-transact-ts.git /tmp/dbos
          git -C /tmp/dbos checkout --detach "$DBOS_SHA"
          test "$(git -C /tmp/dbos rev-parse HEAD)" = "$DBOS_SHA"
          grep -qi '^MIT License' /tmp/dbos/LICENSE
      - name: Build pinned DBOS SDK donor
        working-directory: /tmp/dbos
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          test -f dist/src/index.js
      - name: Validate private controller and publication safety contracts
        run: |
          set -euo pipefail
          node --check scripts/wolf-factory-boxxkite-acceptance.mjs
          node --check infra/worker-router/factory-service-transports.mjs
          node --test \
            infra/autonomy/engineering-commit-journal.test.mjs \
            infra/autonomy/verified-cycle-continuation.test.mjs \
            tests/wolf-authorized-git-publication.test.mjs \
            tests/wolf-boxxkite-service-transport.test.mjs \
            tests/wolf-dbos-mode-validation.test.mjs
          echo PRIVATE_CONTROLLER_SAFETY_CONTRACTS=PASS
      - name: DBOS prepare fixture
        run: node scripts/wolf-dbos-outer-e2e.mjs prepare
      - name: DBOS verified crash before verifier
        run: |
          set -euo pipefail
          set +e
          node scripts/wolf-dbos-outer-e2e.mjs crash > "$RUNNER_TEMP/wolf-dbos-crash.out" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 77
          test "$(cat "$WOLF_DBOS_FIXTURE_ROOT/effect.count")" = 1
          test ! -f "$WOLF_DBOS_FIXTURE_ROOT/verifier.count"
      - name: DBOS recover and controlled M2 restart
        run: |
          set -euo pipefail
          set +e
          node scripts/wolf-dbos-outer-e2e.mjs recover-crash-after-m2 > "$RUNNER_TEMP/wolf-dbos-m2.out" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 78
          test "$(cat "$WOLF_DBOS_FIXTURE_ROOT/effect.count")" = 2
          test "$(cat "$WOLF_DBOS_FIXTURE_ROOT/verifier.count")" = 2
      - name: DBOS recover and complete M3
        run: |
          set -euo pipefail
          node scripts/wolf-dbos-outer-e2e.mjs recover | grep 'WOLF_DBOS_OUTER_E2E='
          test "$(cat "$WOLF_DBOS_FIXTURE_ROOT/effect.count")" = 3
          test "$(cat "$WOLF_DBOS_FIXTURE_ROOT/verifier.count")" = 3
          echo PRIVATE_DBOS_RUNNER_RECOVERY=PASS

  service-access:
    needs: security-tests
    if: github.repository == 'insidethemarginmedia-cpu/wolf-factory-home' && github.ref == 'refs/heads/feat/public-runtime-probe-20261022' && github.actor == 'insidethemarginmedia-cpu'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify OpenRouter authentication independently (no inference)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/private-controller-preflight.mjs --openrouter-auth-only
      - name: Verify GitHub token identity without private source access
        env:
          WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
        run: node scripts/private-controller-preflight.mjs --github-auth-only
      - name: Verify service access without inference or private checkout
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
        run: node scripts/private-controller-preflight.mjs
      - name: Verify private source archive authorization without downloading
        if: github.event_name == 'workflow_dispatch' && inputs.verify_private_source == true
        env:
          WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
          WOLF_FACTORY_EXPECTED_SHA: ff0a29aae8179d9c4a0c57d5772ae58f282c5ea6
        run: node scripts/private-source-authorization.mjs
      - name: Checkout private Factory at approved immutable SHA (read only)
        if: github.event_name == 'workflow_dispatch' && inputs.verify_private_checkout == true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: donraposo1-source/project-wolf
          ref: ff0a29aae8179d9c4a0c57d5772ae58f282c5ea6
          token: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
          path: private-factory
          persist-credentials: false
          fetch-depth: 1
      - name: Verify private checkout and controller entrypoint (no execution)
        if: github.event_name == 'workflow_dispatch' && inputs.verify_private_checkout == true
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-factory rev-parse HEAD)" = 'ff0a29aae8179d9c4a0c57d5772ae58f282c5ea6'
          test -f private-factory/scripts/wolf-factory-boxxkite-acceptance.mjs
          test -f private-factory/infra/autonomy/authorized-git-publication.mjs
          test -f private-factory/infra/autonomy/engineering-commit-journal.mjs
          test -f private-factory/.github/workflows/factory-dbos-outer-e2e.yml
          test -z "$(git -C private-factory status --porcelain)"
          echo PRIVATE_FACTORY_CHECKOUT_VERIFIED=YES
      - name: Qualify existing private worker adapter with free inference
        if: github.event_name == 'workflow_dispatch' && inputs.qualify_worker == true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
        run: node scripts/existing-worker-qualification.mjs
      - name: Diagnose Boxxkite service access without sandbox creation
        env:
          WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
          BOXXKITE_API_KEY: ${{ secrets.BOXXKITE_API_KEY }}
        run: node scripts/boxxkite-service-diagnostic.mjs

  opencode-runtime:
    needs: security-tests
    if: github.event_name == 'workflow_dispatch' && inputs.qualify_opencode == true && github.repository == 'insidethemarginmedia-cpu/wolf-factory-home' && github.ref == 'refs/heads/feat/public-runtime-probe-20261022' && github.actor == 'insidethemarginmedia-cpu'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CEZAR_SHA: 1b13522dd3642a4ea8331629b3680838164d2a2e
      OPENCODE_VERSION_PIN: 1.18.34
    steps:
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reuse or install pinned existing OpenCode runtime
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v opencode >/dev/null; then
            npm install -g "opencode-ai@$OPENCODE_VERSION_PIN" --no-audit --no-fund
          fi
          test "$(opencode --version)" = "$OPENCODE_VERSION_PIN"
          echo "CEZ_OPENCODE_BIN=$(command -v opencode)" >> "$GITHUB_ENV"
          echo OPENCODE_VERSION_EXIT_CODE=0
          opencode --help >/dev/null
          echo OPENCODE_HELP_EXIT_CODE=0
      - name: Build the existing pinned Cezar controller
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/open-mercato/cezar.git "$RUNNER_TEMP/cezar"
          git -C "$RUNNER_TEMP/cezar" checkout -q "$CEZAR_SHA"
          test "$(git -C "$RUNNER_TEMP/cezar" rev-parse HEAD)" = "$CEZAR_SHA"
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/cezar"
          npm run build --prefix "$RUNNER_TEMP/cezar"
          echo "WOLF_CEZAR_RUNNER=$RUNNER_TEMP/cezar/packages/cezar/dist/core/opencode-server-runner.js" >> "$GITHUB_ENV"
      - name: Invoke existing Cezar OpenCode runner without inference
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {pathToFileURL} from 'node:url';
          const {OpencodeServerRunner}=await import(pathToFileURL(process.env.WOLF_CEZAR_RUNNER).href);
          const events=[];
          let session;
          const runner=new OpencodeServerRunner({bin:process.env.CEZ_OPENCODE_BIN,timeoutMs:20000});
          session=runner.startSession({cwd:process.env.RUNNER_TEMP,userPrompt:'',timeoutMs:20000,env:{OPENCODE_CONFIG_CONTENT:JSON.stringify({enabled_providers:[],permission:'deny'}),OPENCODE_DISABLE_MODELS_FETCH:'true',OPENCODE_DISABLE_AUTOUPDATE:'true'}},event=>{events.push(event);if(event.type==='session')session.end();});
          const result=await session.result;
          let processExited=false;try{process.kill(session.pid,0);}catch(error){if(error.code==='ESRCH')processExited=true;else throw error;}
          if(!processExited)throw Error('OPENCODE_CHILD_STILL_ALIVE');
          if(!events.some(e=>e.type==='session'&&typeof e.sessionId==='string')||result.tokensUsed!==0||result.toolCalls.length!==0||result.text!=='')throw Error('CEZAR_NON_AI_LIFECYCLE_NOT_VERIFIED');
          console.log('CEZAR_OPENCODE_NON_AI='+JSON.stringify({sessionId:result.sessionId,tokensUsed:result.tokensUsed,toolCalls:result.toolCalls.length,inferencePerformed:false,serverTerminated:processExited,errorMessages:events.filter(e=>e.type==='error').map(e=>e.message),events:events.map(e=>e.type)}));
          NODE
          echo CEZAR_OPENCODE_LIFECYCLE_EXIT_CODE=0

  integrated-factory:
    needs: security-tests
    if: github.event_name == 'workflow_dispatch' && inputs.execute_integrated == true && github.repository == 'insidethemarginmedia-cpu/wolf-factory-home' && github.ref == 'refs/heads/feat/public-runtime-probe-20261022' && github.actor == 'insidethemarginmedia-cpu'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dbos
          POSTGRES_DB: wolf_factory_dbos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wolf_factory_dbos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CEZAR_SHA: 1b13522dd3642a4ea8331629b3680838164d2a2e
      OPENCODE_VERSION_PIN: 1.18.34
      WOLF_FACTORY_CWD: ${{ github.workspace }}
      WOLF_FACTORY_RUNTIME_ROOT: /tmp/wolf-integrated-${{ github.run_id }}
      WOLF_FACTORY_ACCEPTANCE_MANIFEST: /tmp/wolf-manifest-${{ github.run_id }}.json
      WOLF_FACTORY_ACCEPTANCE_TRANSPORT: direct-service
      WOLF_FACTORY_EXPECTED_SHA: b95652b4bcc844081f34c67dcdb3b6f93d37c874
      GROQ_FREE_PLAN_CONFIRMED: 'true'
      DBOS_SHA: 3f36908f58fd8b3079cbf5372203c7a2d0ba06cc
      WOLF_DBOS_SYSTEM_DATABASE_URL: postgresql://postgres:dbos@localhost:5432/wolf_factory_dbos
      WOLF_DBOS_FIXTURE_ROOT: /tmp/wolf-factory-dbos-e2e
      WOLF_DBOS_SDK_ENTRYPOINT: /tmp/dbos/dist/src/index.js
      EUR_SPEND: '0'
      COST_UNKNOWN: DENY
      PAID_FALLBACK: DENY
      TRIAL_CREDIT: DENY
    steps:
      - name: Checkout private Factory at verified immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: donraposo1-source/project-wolf
          ref: b95652b4bcc844081f34c67dcdb3b6f93d37c874
          token: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Assert immutable source and recovery fixture
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'b95652b4bcc844081f34c67dcdb3b6f93d37c874'
          test -f scripts/wolf-dbos-outer-e2e.mjs
          test -f scripts/wolf-factory-boxxkite-acceptance.mjs
          test -z "$(git status --porcelain)"
          echo PRIVATE_FACTORY_DBOS_SOURCE_VERIFIED=YES
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install private Factory lockfile dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Checkout pinned DBOS SDK donor
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/dbos-inc/dbos-transact-ts.git /tmp/dbos
          git -C /tmp/dbos checkout --detach "$DBOS_SHA"
          test "$(git -C /tmp/dbos rev-parse HEAD)" = "$DBOS_SHA"
          grep -qi '^MIT License' /tmp/dbos/LICENSE
      - name: Build pinned DBOS SDK donor
        working-directory: /tmp/dbos
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          test -f dist/src/index.js
      - name: Validate private controller and publication safety contracts
        run: |
          set -euo pipefail
          node --check scripts/wolf-factory-boxxkite-acceptance.mjs
          node --check infra/worker-router/factory-service-transports.mjs
          node --test \
            infra/autonomy/engineering-commit-journal.test.mjs \
            infra/autonomy/verified-cycle-continuation.test.mjs \
            tests/wolf-authorized-git-publication.test.mjs \
            tests/wolf-boxxkite-service-transport.test.mjs \
            tests/wolf-dbos-mode-validation.test.mjs
          echo PRIVATE_CONTROLLER_SAFETY_CONTRACTS=PASS
      - name: Full private regression and build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix infra/worker-router/mastra-runtime
          npm test
          node --test infra/worker-router/groq-opencode-admission.test.mjs
          npm run build
      - name: Require existing service credentials without reading values
        env:
          WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BOXXKITE_API_KEY: ${{ secrets.BOXXKITE_API_KEY }}
        run: |
          set -euo pipefail
          for name in WOLF_FACTORY_REPO_TOKEN OPENROUTER_API_KEY GROQ_API_KEY BOXXKITE_API_KEY; do
            if test -z "${!name:-}"; then echo "INTEGRATED_CONFIGURATION_REQUIRED=$name"; exit 78; fi
          done
      - name: Admit existing free OpenRouter key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const r=await fetch('https://openrouter.ai/api/v1/key',{headers:{authorization:'Bearer '+process.env.OPENROUTER_API_KEY},signal:AbortSignal.timeout(20000)});
          if(!r.ok)throw Error('OPENROUTER_AUTH_DENIED');
          const k=(await r.json()).data;
          if(k.is_free_tier!==true||k.limit!==0||k.byok_usage!==0)throw Error('FREE_KEY_ADMISSION_REQUIRED');
          console.log('INTEGRATED_OPENROUTER_ECONOMIC_ADMISSION=PASS');
          NODE
      - name: Reuse or install pinned existing OpenCode runtime
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v opencode >/dev/null; then
            npm install -g "opencode-ai@$OPENCODE_VERSION_PIN" --no-audit --no-fund
          fi
          test "$(opencode --version)" = "$OPENCODE_VERSION_PIN"
          echo "CEZ_OPENCODE_BIN=$(command -v opencode)" >> "$GITHUB_ENV"
          echo OPENCODE_VERSION_EXIT_CODE=0
          opencode --help >/dev/null
          echo OPENCODE_HELP_EXIT_CODE=0
      - name: Build the existing pinned Cezar controller
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/open-mercato/cezar.git "$RUNNER_TEMP/cezar"
          git -C "$RUNNER_TEMP/cezar" checkout -q "$CEZAR_SHA"
          test "$(git -C "$RUNNER_TEMP/cezar" rev-parse HEAD)" = "$CEZAR_SHA"
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/cezar"
          npm run build --prefix "$RUNNER_TEMP/cezar"
          echo "WOLF_CEZAR_RUNNER=$RUNNER_TEMP/cezar/packages/cezar/dist/core/opencode-server-runner.js" >> "$GITHUB_ENV"
      - name: Prepare bounded synthetic missions and authorized Git transport
        shell: bash
        run: |
          set -euo pipefail
          git switch -c feat/factory-real-worker-m1-20261006
          git remote set-url origin https://github.com/donraposo1-source/project-wolf.git
          git config credential.helper '!f() { echo username=x-access-token; echo password="$WOLF_FACTORY_REPO_TOKEN"; }; f'
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const root=process.env.WOLF_FACTORY_RUNTIME_ROOT;
          for(const dir of ['.continuity/memory','.continuity/tasks','.continuity/missions'])fs.mkdirSync(path.join(root,dir),{recursive:true});
          fs.writeFileSync(path.join(root,'.continuity/memory/founder_directives.md'),'EUR_SPEND=0\nCOST_UNKNOWN=DENY\nFOUNDER_INTERVENTIONS=0\nFOUNDER_REPETITIONS=0\nUNKNOWN=>CLOSED\n');
          fs.writeFileSync(path.join(root,'.continuity/memory/current_state.md'),'# Synthetic integrated acceptance\n');
          for(const file of ['task_queue.json','completed_tasks.json'])fs.writeFileSync(path.join(root,'.continuity/tasks',file),'[]\n');
          const run=process.env.GITHUB_RUN_ID;
          const test=(expression)=>"import importlib.util\nfrom pathlib import Path\ns=importlib.util.spec_from_file_location('candidate',Path(__file__).with_name('candidate.py'))\nm=importlib.util.module_from_spec(s);s.loader.exec_module(m)\n"+expression+'\n';
          const missions=[{taskId:'OMEGA_A_'+run,target:'docs/factory-acceptance/omega-'+run+'-a.py',fixtureSource:'def add(a,b):\n    return a-b\n',requirement:'add(a,b) must return the arithmetic sum of the two integers.',testSource:test('assert m.add(2,3)==5\nassert m.add(-3,2)==-1'),independentSource:test('for a in range(-5,6):\n for b in range(-5,6): assert m.add(a,b)==a+b')},{taskId:'OMEGA_B_'+run,target:'docs/factory-acceptance/omega-'+run+'-b.py',fixtureSource:'def normalize(value):\n    return value.strip()\n',requirement:'normalize(value) strips whitespace, collapses every run of internal whitespace into a single space, and lowercases text.',testSource:test("assert m.normalize(' A  B ')=='a b'\nassert m.normalize(' HeLLo ')=='hello'"),independentSource:test("assert m.normalize('')==''\nassert m.normalize(' A\\tB\\n C ')=='a b c'\nassert m.normalize(' X ')==m.normalize(m.normalize(' X '))")}];
          fs.writeFileSync(process.env.WOLF_FACTORY_ACCEPTANCE_MANIFEST,JSON.stringify({baseSha:process.env.WOLF_FACTORY_EXPECTED_SHA,workflowID:'wolf-omega-integrated-'+run,requireIntegratedReview:true,restartAfterMissionA:true,missions}));
          NODE
      - name: Execute Mission A then restart existing controller for automatic Mission B
        env:
          WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BOXXKITE_API_KEY: ${{ secrets.BOXXKITE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/wolf-dbos-existing-factory-engineering.mjs > "$RUNNER_TEMP/wolf-first.log" 2>&1
          rc=$?
          set -e
          if test "$rc" -ne 79; then tail -c 8000 "$RUNNER_TEMP/wolf-first.log"; exit 1; fi
          grep WOLF_MISSION_A_DURABLE_BEFORE_RESTART "$RUNNER_TEMP/wolf-first.log"
          node scripts/wolf-dbos-existing-factory-engineering.mjs > "$RUNNER_TEMP/wolf-recovery.log" 2>&1 || { tail -c 8000 "$RUNNER_TEMP/wolf-recovery.log"; exit 1; }
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const root=process.env.WOLF_FACTORY_RUNTIME_ROOT;
          const final=JSON.parse(fs.readFileSync(path.join(root,'acceptance-final.json'),'utf8'));
          if(final.dbosStatus!=='SUCCESS'||final.evidence.length!==2||final.result.state!=='NEXT_READY_DRAINED'||!final.restartReceipt||final.restartReceipt.pid===final.controllerPid)throw Error('INTEGRATED_RESTART_ACCEPTANCE_FAILED');
          for(const p of final.evidence){if(!p.integratedReview||p.cycle.state!=='CYCLE_COMPLETED'||!p.durable?.checkpointId)throw Error('INTEGRATED_MISSION_EVIDENCE_REQUIRED');}
          console.log('WOLF_INTEGRATED_ACCEPTANCE='+JSON.stringify({workflowID:final.workflowID,restartReceipt:final.restartReceipt,controllerPid:final.controllerPid,result:final.result,missions:final.evidence.map(p=>({missionId:p.spec.taskId,flint:p.providerReceipts.map(r=>r.generationId),opencode:p.integratedReview.opencode,groq:p.integratedReview.groq,executor:p.remoteReceipts,checkpoint:p.durable,verification:p.verifierReceipts.map(v=>({receiptId:v.receiptId,local:v.local,remote:v.remote})),trace:p.trace}))}));
          NODE
      - name: Read back bounded synthetic execution receipts
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const root=process.env.WOLF_FACTORY_RUNTIME_ROOT;if(!fs.existsSync(root))process.exit(0);
          for(const f of fs.readdirSync(root).filter(n=>/^OMEGA_[AB]_[0-9]+-(provider|integrated-review|remote|verifiers|cleanup)\.json$/.test(n))){
            const v=JSON.parse(fs.readFileSync(path.join(root,f),'utf8'));let evidence;
            if(f.endsWith('-provider.json'))evidence=v.map(r=>({generationId:r.generationId,model:r.model,costUsd:r.costUsd}));
            else if(f.endsWith('-remote.json'))evidence=v.map(r=>({jobId:r.jobId,sandboxId:r.sandboxId,passed:r.passed,exitCode:r.exitCode,sourceSha256:r.sourceSha256}));
            else if(f.endsWith('-verifiers.json'))evidence=v.map(r=>({receiptId:r.receiptId,localStatus:r.local?.status,remotePassed:r.remote?.passed}));
            else evidence=v;
            console.log('WOLF_PARTIAL_RECEIPT='+JSON.stringify({file:f,evidence}));
          }
          NODE
