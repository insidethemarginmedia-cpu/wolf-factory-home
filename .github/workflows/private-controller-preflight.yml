      - name: Observe an unknown Boxxkite create with the existing controller credential
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/omega-acceptance-ready-20261028' && inputs.reconcile_boxxkite_label != ''
        env:
          BOXXKITE_API_KEY: ${{ secrets.BOXXKITE_API_KEY }}
          WOLF_BOXXKITE_RECONCILE_LABEL: ${{ inputs.reconcile_boxxkite_label }}
        run: node scripts/boxxkite-service-diagnostic.mjs --reconcile-create
      - name: Verify OpenRouter authentication independently (no inference)
        if: inputs.night_shift != true && env.OPENROUTER_API_KEY != ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/private-controller-preflight.mjs --openrouter-auth-only
      - name: Verify GitHub token identity without private source access
        env:
          WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
        run: node scripts/private-controller-preflight.mjs --github-auth-only
      - name: Read current free request allowance without inference
        if: github.event_name == 'workflow_dispatch' && inputs.night_shift != true && env.OPENROUTER_API_KEY != '' && inputs.execute_integrated != true && inputs.verify_private_regression != true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: 'node --input-type=module <<''NODE''
      
          const r=await fetch(''https://openrouter.ai/api/v1/key'',{headers:{authorization:''Bearer ''+process.env.OPENROUTER_API_KEY},redirect:''error'',signal:AbortSignal.timeout(20000)});
      
          if(!r.ok)throw Error(''FREE_KEY_METADATA_UNAVAILABLE'');
      
          const d=(await r.json()).data,q=d.free_model_daily_requests;
      
          console.log(''WOLF_FREE_ALLOWANCE=''+JSON.stringify({httpStatus:r.status,isFreeTier:d.is_free_tier===true,zeroKeyLimit:d.limit===0,byokUsageZero:d.byok_usage===0,dailyRequests:q&&[''limit'',''remaining'',''used''].every(k=>Number.isSafeInteger(q[k])&&q[k]>=0)?q:''NOT_OBSERVED'',inferencePerformed:false}));
      
          NODE
      
          '
      - name: Diagnose existing runner publication credential without writes
        if: github.event_name == 'workflow_dispatch' && inputs.diagnose_publication == true
        env:
          WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.WOLF_FACTORY_REPO_TOKEN;
          if(!token||!/^[\x21-\x7e]+$/.test(token))throw Error('CREDENTIAL_FORMAT_REQUIRED');
          const headers={authorization:'Bearer '+token,'user-agent':'WolfFactoryPreflight'};
          const get=url=>fetch(url,{headers,redirect:'error',signal:AbortSignal.timeout(20000)});
          const userResponse=await get('https://api.github.com/user');
          if(!userResponse.ok)throw Error('GITHUB_IDENTITY_DENIED');
          const user=await userResponse.json();
          const scopes=(userResponse.headers.get('x-oauth-scopes')||'').split(',').map(s=>s.trim());
          const repoResponse=await get('https://api.github.com/repos/donraposo1-source/project-wolf');
          if(!repoResponse.ok)throw Error('PRIVATE_REPOSITORY_DENIED');
          const repo=await repoResponse.json();
          if(repo.full_name!=='donraposo1-source/project-wolf'||repo.private!==true)throw Error('REPOSITORY_IDENTITY_DENIED');
          const receive=await fetch('https://github.com/donraposo1-source/project-wolf.git/info/refs?service=git-receive-pack',{headers:{authorization:'Basic '+Buffer.from('x-access-token:'+token).toString('base64'),'user-agent':'git/wolf-publication-preflight'},redirect:'error',signal:AbortSignal.timeout(20000)});
          const result={state:receive.ok?'RECEIVE_PACK_ADMITTED':'BLOCKED',credentialType:token.startsWith('github_pat_')?'FINE_GRAINED_PAT':token.startsWith('ghp_')?'CLASSIC_PAT':token.startsWith('gho_')?'OAUTH':'OTHER',ownerIdentityMatches:user.login==='donraposo1-source',accountPushRole:repo.permissions?.push===true,classicRepoScope:scopes.includes('repo'),scopeHeaderPresent:scopes.some(Boolean),receivePackHttpStatus:receive.status,refUpdated:false,inferencePerformed:false,privateSourceFetched:false};
          await receive.body?.cancel();
          console.log('WOLF_PUBLICATION_CREDENTIAL_DIAGNOSTIC='+JSON.stringify(result));
          if(!receive.ok)process.exitCode=78;
          NODE
      - name: Verify service access without inference or private checkout
        if: inputs.night_shift != true && env.OPENROUTER_API_KEY != ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
        run: node scripts/private-controller-preflight.mjs
      - name: Verify private source archive authorization without downloading
        if: github.event_name == 'workflow_dispatch' && inputs.verify_private_source == true
        env:
          WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
          WOLF_FACTORY_EXPECTED_SHA: ff0a29aae8179d9c4a0c57d5772ae58f282c5ea6
        run: node scripts/private-source-authorization.mjs
      - name: Checkout private Factory at approved immutable SHA (read only)
        if: github.event_name == 'workflow_dispatch' && inputs.verify_private_checkout == true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: donraposo1-source/project-wolf
          ref: ff0a29aae8179d9c4a0c57d5772ae58f282c5ea6
          token: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
          path: private-factory
          persist-credentials: false
          fetch-depth: 1
      - name: Verify private checkout and controller entrypoint (no execution)
        if: github.event_name == 'workflow_dispatch' && inputs.verify_private_checkout == true
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-factory rev-parse HEAD)" = 'ff0a29aae8179d9c4a0c57d5772ae58f282c5ea6'
          test -f private-factory/scripts/wolf-factory-boxxkite-acceptance.mjs
          test -f private-factory/infra/autonomy/authorized-git-publication.mjs
          test -f private-factory/infra/autonomy/engineering-commit-journal.mjs
          test -f private-factory/.github/workflows/factory-dbos-outer-e2e.yml
          test -z "$(git -C private-factory status --porcelain)"
          echo PRIVATE_FACTORY_CHECKOUT_VERIFIED=YES
      - name: Qualify existing private worker adapter with free inference
        if: github.event_name == 'workflow_dispatch' && inputs.qualify_worker == true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
        run: node scripts/existing-worker-qualification.mjs
      - name: Checkout immutable Groq verifier for independent live read-only verification
        if: github.event_name == 'workflow_dispatch' && inputs.verify_private_regression == true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: donraposo1-source/project-wolf
          ref: ${{ needs.factory-source-admission.outputs.source_sha }}
          token: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
          path: private-groq-observer
          persist-credentials: false
          fetch-depth: 1
      - name: Verify the corrected Groq classifier against live metadata without inference
        if: github.event_name == 'workflow_dispatch' && inputs.verify_private_regression == true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: "node --input-type=module <<'NODE'\nimport {verifyProviderQuotas} from './private-groq-observer/scripts/wolf-night-shift-wakeup.mjs';\n\
          try{const q=await verifyProviderQuotas();console.log('WOLF_LIVE_QUOTA_GATE='+JSON.stringify({state:'QUOTA_VERIFIED',inferencePerformed:false,observation:q}));}catch(e){const\
          \ allowed=new Set(['GROQ_AUTH_DENIED','GROQ_METADATA_UNAVAILABLE','GROQ_QUOTA_HEADERS_MISSING','GROQ_QUOTA_MALFORMED','GROQ_QUOTA_EXHAUSTED','GROQ_PROVIDER_UNAVAILABLE','FREE_KEY_ADMISSION_REQUIRED','OPENROUTER_FREE_QUOTA_UNKNOWN_OR_EXHAUSTED','PROVIDER_METADATA_UNAVAILABLE']);if(!allowed.has(e.message))throw\
          \ Error('UNCLASSIFIED_QUOTA_FAILURE');console.log('WOLF_LIVE_QUOTA_GATE='+JSON.stringify({state:'BLOCKED',reason:e.message,inferencePerformed:false}));}\n\
          // Independent raw-header comparison on the same authorized metadata endpoint.\n// No user-agent spoofing, endpoint rotation, redirects, inference\
          \ or retries.\nimport https from 'node:https';\nconst raw=await new Promise(resolve=>{\n const r=https.request('https://api.groq.com/openai/v1/models',{method:'GET',headers:{authorization:'Bearer\
          \ '+process.env.GROQ_API_KEY}},response=>{\n  const names=response.rawHeaders.filter((_,i)=>i%2===0).map(x=>x.toLowerCase());\n  const result={client:'node-https-raw',httpStatus:response.statusCode,rawHeaderNames:names,requestsHeaderPresent:names.includes('x-ratelimit-remaining-requests'),tokensHeaderPresent:names.includes('x-ratelimit-remaining-tokens'),inferencePerformed:false};response.resume();response.on('end',()=>resolve(result));response.on('error',()=>resolve({client:'node-https-raw',state:'METADATA_UNAVAILABLE'}));\n\
          \ });r.setTimeout(20000,()=>r.destroy());r.on('error',()=>resolve({client:'node-https-raw',state:'METADATA_UNAVAILABLE'}));r.end();\n});\n\
          console.log('WOLF_GROQ_RAW_HEADER_COMPARISON='+JSON.stringify(raw));\nconst r=await fetch('https://api.groq.com/openai/v1/models/openai/gpt-oss-120b',{method:'GET',headers:{authorization:'Bearer\
          \ '+process.env.GROQ_API_KEY},redirect:'error',signal:AbortSignal.timeout(20000)});\nlet catalogModelPresent=false;\nif(r.ok){const d=await\
          \ r.json();catalogModelPresent=d.id==='openai/gpt-oss-120b'&&d.active!==false;}else await r.body?.cancel();\nconsole.log('WOLF_GROQ_RETRIEVE_METADATA='+JSON.stringify({method:'GET',route:'/openai/v1/models/openai/gpt-oss-120b',httpStatus:r.status,catalogModelPresent,requestsHeaderPresent:r.headers.has('x-ratelimit-remaining-requests'),tokensHeaderPresent:r.headers.has('x-ratelimit-remaining-tokens'),inferencePerformed:false}));\n\
          \nNODE\n"
      - name: Diagnose Boxxkite service access without sandbox creation
        env:
          WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
          BOXXKITE_API_KEY: ${{ secrets.BOXXKITE_API_KEY }}
        run: node scripts/boxxkite-service-diagnostic.mjs

  opencode-runtime:
    needs: security-tests
    if: always() && needs.security-tests.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.qualify_opencode == true && github.repository == 'insidethemarginmedia-cpu/wolf-factory-home' && github.ref == 'refs/heads/feat/public-runtime-probe-20261022' && github.actor == 'insidethemarginmedia-cpu'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CEZAR_SHA: 1b13522dd3642a4ea8331629b3680838164d2a2e
      OPENCODE_VERSION_PIN: 1.18.34
    steps:
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reuse or install pinned existing OpenCode runtime
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v opencode >/dev/null; then
            npm install -g "opencode-ai@$OPENCODE_VERSION_PIN" --no-audit --no-fund
          fi
          test "$(opencode --version)" = "$OPENCODE_VERSION_PIN"
          echo "CEZ_OPENCODE_BIN=$(command -v opencode)" >> "$GITHUB_ENV"
          echo OPENCODE_VERSION_EXIT_CODE=0
          opencode --help >/dev/null
          echo OPENCODE_HELP_EXIT_CODE=0
      - name: Build the existing pinned Cezar controller
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/open-mercato/cezar.git "$RUNNER_TEMP/cezar"
          git -C "$RUNNER_TEMP/cezar" checkout -q "$CEZAR_SHA"
          test "$(git -C "$RUNNER_TEMP/cezar" rev-parse HEAD)" = "$CEZAR_SHA"
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/cezar"
          npm run build --prefix "$RUNNER_TEMP/cezar"
          echo "WOLF_CEZAR_RUNNER=$RUNNER_TEMP/cezar/packages/cezar/dist/core/opencode-server-runner.js" >> "$GITHUB_ENV"
      - name: Invoke existing Cezar OpenCode runner without inference
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {pathToFileURL} from 'node:url';
          const {OpencodeServerRunner}=await import(pathToFileURL(process.env.WOLF_CEZAR_RUNNER).href);
          const events=[];
          let session;
          const runner=new OpencodeServerRunner({bin:process.env.CEZ_OPENCODE_BIN,timeoutMs:20000});
          session=runner.startSession({cwd:process.env.RUNNER_TEMP,userPrompt:'',timeoutMs:20000,env:{OPENCODE_CONFIG_CONTENT:JSON.stringify({enabled_providers:[],permission:'deny'}),OPENCODE_DISABLE_MODELS_FETCH:'true',OPENCODE_DISABLE_AUTOUPDATE:'true'}},event=>{events.push(event);if(event.type==='session')session.end();});
          const result=await session.result;
          let processExited=false;try{process.kill(session.pid,0);}catch(error){if(error.code==='ESRCH')processExited=true;else throw error;}
          if(!processExited)throw Error('OPENCODE_CHILD_STILL_ALIVE');
          if(!events.some(e=>e.type==='session'&&typeof e.sessionId==='string')||result.tokensUsed!==0||result.toolCalls.length!==0||result.text!=='')throw Error('CEZAR_NON_AI_LIFECYCLE_NOT_VERIFIED');
          console.log('CEZAR_OPENCODE_NON_AI='+JSON.stringify({sessionId:result.sessionId,tokensUsed:result.tokensUsed,toolCalls:result.toolCalls.length,inferencePerformed:false,serverTerminated:processExited,errorMessages:events.filter(e=>e.type==='error').map(e=>e.message),events:events.map(e=>e.type)}));
          NODE
          echo CEZAR_OPENCODE_LIFECYCLE_EXIT_CODE=0

