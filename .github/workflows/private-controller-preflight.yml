name: Private Controller Access Preflight
on:
  push:
    branches: [feat/public-runtime-probe-20261022]
    paths:
      - '.github/workflows/private-controller-preflight.yml'
      - 'scripts/private-controller-preflight.mjs'
      - 'tests/private-controller-preflight.test.mjs'
permissions:
  contents: read
concurrency:
  group: private-controller-preflight
  cancel-in-progress: false
jobs:
  security-tests:
    if: github.repository == 'insidethemarginmedia-cpu/wolf-factory-home' && github.actor == 'insidethemarginmedia-cpu'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - run: node --test tests/private-controller-preflight.test.mjs
  service-access:
    needs: security-tests
    if: github.repository == 'insidethemarginmedia-cpu/wolf-factory-home' && github.ref == 'refs/heads/feat/public-runtime-probe-20261022' && github.actor == 'insidethemarginmedia-cpu'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify service access without inference or private checkout
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
        run: node scripts/private-controller-preflight.mjs
