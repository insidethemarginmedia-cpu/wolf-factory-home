          if(!key||!key.startsWith('-----BEGIN OPENSSH PRIVATE KEY-----')){console.error('PUBLICATION_DEPLOY_KEY_REQUIRED');process.exit(78);}
          const keyFile=path.join(process.env.RUNNER_TEMP,'wolf-publication-key');
