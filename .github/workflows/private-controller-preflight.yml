name: Private Controller Access Preflight
on:
  workflow_call:
    inputs:
      consult_ollama:
        type: boolean
        default: false
      public_runtime_sha:
        type: string
        required: true
      night_shift:
        type: boolean
        default: false
    secrets:
      WOLF_FACTORY_REPO_TOKEN:
        required: true
      WOLF_FACTORY_DEPLOY_KEY:
        required: true
      OPENROUTER_API_KEY:
        required: false
      GROQ_API_KEY:
        required: true
      BOXXKITE_API_KEY:
        required: true
    outputs:
      operational_outcome:
        description: >-
          Operational disposition of the bounded wakeup. MISSION_WORK_ADMITTED,
          NO_MISSION_WORK_PERFORMED or V1_TERMINAL_DISPOSITION_ONLY. A run is not
          autonomous acceptance unless this value is MISSION_WORK_ADMITTED.
        value: ${{ jobs.night-shift-admission.outputs.operational_outcome }}
  workflow_dispatch:
    inputs:
      consult_ollama:
        description: Optional reuse of the qualified advisory Ollama runtime
        type: boolean
        default: false
      public_runtime_sha:
        description: Optional literal runtime SHA; direct dispatch otherwise uses its exact HEAD
        type: string
        default: ''
      night_shift:
        description: Run one bounded manual wakeup through the existing Factory
        type: boolean
        default: false
      diagnose_publication:
        description: Inspect existing runner credential scope and Git receive-pack admission without writing
        type: boolean
        default: false
      verify_private_source:
        description: Verify private source authorization only, without fetching source
        type: boolean
        default: false
      reconcile_boxxkite_label:
        description: Read-only exact-label lookup after an unknown sandbox create; never retries
        type: string
        default: ''
      verify_private_checkout:
        description: Read-only private checkout at pinned source SHA, no inference or publication
        type: boolean
        default: false
      verify_dbos_runtime:
        description: Run existing private DBOS crash-recovery fixture in an isolated read-only runner
        type: boolean
        default: false
      use_publication_deploy_key:
        description: Use the explicitly authorized repository-scoped SSH publication credential
        type: boolean
        default: true
      verify_private_regression:
        description: Run private regression and build only; no inference, sandbox or publication
        type: boolean
        default: false
      reconcile_v1:
        description: Independently read and reconcile historical V1 receipts without any journal mutation
        type: boolean
        default: false
      v1_expected_revision:
        description: Exact operational branch SHA required by the read-only V1 verifier
        type: string
        default: ''
      v1_terminal_request:
        description: Separately approved immutable gate-A request JSON; empty keeps V1 untouched
        type: string
        default: ''
      verify_runner_loss:
        description: Recover the existing Factory on a fresh runner and execute Mission C
        type: boolean
        default: false
      verify_cross_job_ab:
        description: Bounded synthetic A/B across existing jobs with durable KCT and DBOS recovery
        type: boolean
        default: false
      execute_integrated:
        description: Execute existing Factory synthetic missions A and B with correlated review and controller restart
        type: boolean
        default: false
      qualify_opencode:
        description: Qualify real OpenCode and existing Cezar process lifecycle without inference
        type: boolean
        default: false
      qualify_worker:
        description: Run a bounded free inference qualification
        type: boolean
        default: false
  push:
    branches: [feat/public-runtime-probe-20261022, fix/omega-acceptance-ready-20261028]
    paths:
      - '.github/workflows/night-shift-wakeup.yml'
      - '.github/workflows/private-controller-preflight.yml'
      - 'scripts/private-controller-preflight.mjs'
      - 'scripts/private-source-authorization.mjs'
      - 'tests/private-source-authorization.test.mjs'
      - 'tests/private-controller-preflight.test.mjs'
      - 'scripts/existing-worker-qualification.mjs'
      - 'tests/existing-worker-qualification.test.mjs'
      - 'scripts/boxxkite-service-diagnostic.mjs'
      - 'tests/boxxkite-service-diagnostic.test.mjs'
      - 'scripts/private-source-response.mjs'
      - 'tests/private-source-response.test.mjs'
      - 'scripts/git-publication-preflight.mjs'
      - 'tests/git-publication-preflight.test.mjs'
      - 'tests/factory-source-admission.test.mjs'
      - 'tests/public-runtime-pin.test.mjs'
      - 'tests/scheduler-promotion-candidate.test.mjs'
      - 'docs/checkpoints/omega/MAIN-SCHEDULER-PROMOTION-*'
      - 'tests/runner-checkpoint-publication.test.mjs'
      - 'tests/night-shift-operational-outcome.test.mjs'
      - 'tests/publication-reconciliation-superseded.test.mjs'
      - 'tests/gitleaks-immutable-findings.test.mjs'
      - '.gitleaksignore'
      - 'docs/checkpoints/omega/GITLEAKS-IMMUTABLE-NONSECRET-*'
      - 'tests/cross-job-pair-routing.test.mjs'
      - 'tests/runner-state-restore-gate.test.mjs'
      - 'tests/runner-loss-two-job-contract.test.mjs'
      - 'tests/omega-b-preservation.test.mjs'
permissions:
  contents: read
concurrency:
  group: private-controller-preflight
  cancel-in-progress: false
jobs:
  factory-source-admission:
    if: github.repository == 'insidethemarginmedia-cpu/wolf-factory-home' && github.actor == 'insidethemarginmedia-cpu' && (inputs.night_shift == true || inputs.execute_integrated == true || inputs.verify_private_regression == true || inputs.verify_runner_loss == true || inputs.reconcile_v1 == true || inputs.verify_cross_job_ab == true || inputs.v1_terminal_request != '')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      public_runtime_sha: ${{ steps.pin.outputs.public_runtime_sha }}
      source_sha: ${{ steps.pin.outputs.source_sha }}
    steps:
    - name: Resolve authorized Factory HEAD once at admission
      id: pin
      env:
        GITHUB_TOKEN: ${{ github.token }}
        WOLF_NIGHT_SHIFT: ${{ inputs.night_shift }}
        WOLF_PUBLIC_RUNTIME_SHA: ${{ inputs.public_runtime_sha }}
        WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
        WOLF_EXECUTE_INTEGRATED: ${{ inputs.execute_integrated }}
        WOLF_VERIFY_RUNNER_LOSS: ${{ inputs.verify_runner_loss }}
        WOLF_VERIFY_CROSS_JOB: ${{ inputs.verify_cross_job_ab }}
        WOLF_V1_TERMINAL_REQUEST: ${{ inputs.v1_terminal_request }}
        EUR_SPEND: '0'
        COST_UNKNOWN: DENY
        PAID_FALLBACK: DENY
        TRIAL_CREDIT: DENY
      run: |
        node --input-type=module <<'NODE'
        import fs from 'node:fs';
        // PUBLIC_RUNTIME_PIN_BEGIN
        async function resolvePublicRuntimePin(env, fetchImpl = globalThis.fetch) {
          const repository = 'insidethemarginmedia-cpu/wolf-factory-home';
          const scheduled = env.GITHUB_EVENT_NAME === 'schedule' && env.GITHUB_REF === 'refs/heads/main';
          const manual = env.GITHUB_EVENT_NAME === 'workflow_dispatch' && ['refs/heads/feat/public-runtime-probe-20261022', 'refs/heads/fix/omega-acceptance-ready-20261028'].includes(env.GITHUB_REF);
          if (env.GITHUB_REPOSITORY !== repository || env.GITHUB_ACTOR !== 'insidethemarginmedia-cpu' || (!scheduled && !manual)) throw Error('PUBLIC_RUNTIME_SCOPE_DENIED');
          if (env.EUR_SPEND !== '0' || ['COST_UNKNOWN', 'PAID_FALLBACK', 'TRIAL_CREDIT'].some(k => env[k] !== 'DENY')) throw Error('PUBLIC_RUNTIME_COST_DENIED');
          const pin = env.WOLF_PUBLIC_RUNTIME_SHA || (manual ? env.GITHUB_SHA : '');
          if (!/^[a-f0-9]{40}$/.test(pin || '') || !/^[a-f0-9]{40}$/.test(env.GITHUB_SHA || '')) throw Error('PUBLIC_RUNTIME_IMMUTABLE_PIN_REQUIRED');
          if (![env.GITHUB_RUN_ID, env.GITHUB_RUN_ATTEMPT].every(v => /^[1-9][0-9]*$/.test(v || '')) || !env.GITHUB_TOKEN) throw Error('PUBLIC_RUNTIME_CONTEXT_REQUIRED');
          let run;
          try {
            const response = await fetchImpl('https://api.github.com/repos/' + repository + '/actions/runs/' + env.GITHUB_RUN_ID + '/attempts/' + env.GITHUB_RUN_ATTEMPT, {headers: {authorization: 'Bearer ' + env.GITHUB_TOKEN, accept: 'application/vnd.github+json'}, redirect: 'error', signal: AbortSignal.timeout(15000)});
            if (!response.ok) throw Error();
            const raw = await response.text();
            if (Buffer.byteLength(raw) > 262144) throw Error();
            run = JSON.parse(raw);
          } catch { throw Error('PUBLIC_RUNTIME_METADATA_UNAVAILABLE'); }
          if (String(run?.id) !== env.GITHUB_RUN_ID || String(run.run_attempt) !== env.GITHUB_RUN_ATTEMPT || run.event !== env.GITHUB_EVENT_NAME || run.head_sha !== env.GITHUB_SHA) throw Error('PUBLIC_RUNTIME_RUN_MISMATCH');
          const prefix = repository + '/.github/workflows/private-controller-preflight.yml@';
          if (run.referenced_workflows != null && !Array.isArray(run.referenced_workflows)) throw Error('PUBLIC_RUNTIME_CALLEE_MISMATCH');
          const refs = (run.referenced_workflows || []).filter(r => typeof r?.path === 'string' && r.path.startsWith(prefix));
          if (refs.length) {
            if (refs.length !== 1 || refs[0].path !== prefix + pin || refs[0].sha !== pin) throw Error('PUBLIC_RUNTIME_CALLEE_MISMATCH');
          } else if (!manual || run.path !== '.github/workflows/private-controller-preflight.yml' || pin !== env.GITHUB_SHA) throw Error('PUBLIC_RUNTIME_CALLEE_MISMATCH');
          return pin;
        }
        // PUBLIC_RUNTIME_PIN_END
        // FACTORY_SOURCE_ADMISSION_BEGIN
        async function resolveFactorySource(env, fetchImpl = globalThis.fetch) {
          const manual = env.GITHUB_EVENT_NAME === 'workflow_dispatch' && [
            'refs/heads/feat/public-runtime-probe-20261022',
            'refs/heads/fix/omega-acceptance-ready-20261028',
          ].includes(env.GITHUB_REF);
          const scheduled = env.GITHUB_EVENT_NAME === 'schedule' && env.GITHUB_REF === 'refs/heads/main';
          if (env.GITHUB_REPOSITORY !== 'insidethemarginmedia-cpu/wolf-factory-home' ||
              env.GITHUB_ACTOR !== 'insidethemarginmedia-cpu' || (!manual && !scheduled)) {
            throw Error('FACTORY_SOURCE_SCOPE_DENIED');
          }
          if (env.EUR_SPEND !== '0' || ['COST_UNKNOWN', 'PAID_FALLBACK', 'TRIAL_CREDIT'].some(k => env[k] !== 'DENY')) {
            throw Error('FACTORY_SOURCE_COST_DENIED');
          }
          if (env.WOLF_VERIFY_CROSS_JOB === 'true' && (!manual || env.GITHUB_REF !== 'refs/heads/fix/omega-acceptance-ready-20261028' || env.WOLF_NIGHT_SHIFT === 'true' || env.WOLF_EXECUTE_INTEGRATED === 'true' || env.WOLF_VERIFY_RUNNER_LOSS === 'true')) throw Error('FACTORY_SOURCE_CROSS_JOB_SCOPE_DENIED');
          if (env.WOLF_V1_TERMINAL_REQUEST && (!manual || env.WOLF_NIGHT_SHIFT === 'true' || env.WOLF_EXECUTE_INTEGRATED === 'true' || env.WOLF_VERIFY_RUNNER_LOSS === 'true' || env.WOLF_VERIFY_CROSS_JOB === 'true')) throw Error('FACTORY_SOURCE_TERMINAL_SCOPE_DENIED');
          if (env.WOLF_EXECUTE_INTEGRATED === 'true' && env.WOLF_VERIFY_RUNNER_LOSS === 'true') {
            throw Error('FACTORY_SOURCE_CONCURRENT_ACCEPTANCE_DENIED');
          }
          const token = env.WOLF_FACTORY_REPO_TOKEN;
          if (typeof token !== 'string' || !token.trim() || /[\r\n\0]/.test(token)) throw Error('FACTORY_SOURCE_CREDENTIAL_REQUIRED');
          const repository = 'donraposo1-source/project-wolf';
          const branch = 'feat/factory-real-worker-m1-20261006';
          let response;
          try {
            response = await fetchImpl('https://api.github.com/repos/' + repository + '/git/ref/heads/' + branch, {
              headers: {authorization: 'Bearer ' + token, accept: 'application/vnd.github+json'},
              redirect: 'error', signal: AbortSignal.timeout(20000),
            });
          } catch { throw Error('FACTORY_SOURCE_NETWORK_FAILED'); }
          if (!response.ok) throw Error('FACTORY_SOURCE_HTTP_DENIED');
          let data;
          try {
            const raw = await response.text();
            if (Buffer.byteLength(raw) > 8192) throw Error();
            data = JSON.parse(raw);
          } catch { throw Error('FACTORY_SOURCE_RESPONSE_INVALID'); }
          if (data?.ref !== 'refs/heads/' + branch || data.object?.type !== 'commit' || !/^[a-f0-9]{40}$/.test(data.object?.sha || '')) {
            throw Error('FACTORY_SOURCE_REF_DENIED');
          }
          return Object.freeze({repository, branch, sha: data.object.sha});
        }
        // FACTORY_SOURCE_ADMISSION_END
        const publicPin = process.env.WOLF_NIGHT_SHIFT === 'true' ? await resolvePublicRuntimePin(process.env) : process.env.GITHUB_SHA;
        const admission = await resolveFactorySource(process.env);
        fs.appendFileSync(process.env.GITHUB_OUTPUT, 'public_runtime_sha=' + publicPin + '\n');
        fs.appendFileSync(process.env.GITHUB_OUTPUT, 'source_sha=' + admission.sha + '\n');
        console.log('WOLF_FACTORY_SOURCE_ADMITTED=' + JSON.stringify(admission));
        NODE
    - name: Checkout immutable private V1 verifier for an explicitly selected read-only reconciliation
      if: inputs.reconcile_v1 == true && github.event_name == 'workflow_dispatch'
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: donraposo1-source/project-wolf
        ref: ${{ steps.pin.outputs.source_sha }}
        token: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
        path: private-v1-verifier
        persist-credentials: false
        fetch-depth: 1
    - name: Verify original V1 Git effects and execution exclusion without mutation
      if: inputs.reconcile_v1 == true && github.event_name == 'workflow_dispatch'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
        WOLF_V1_EXPECTED_REVISION: ${{ inputs.v1_expected_revision }}
        EUR_SPEND: '0'
        COST_UNKNOWN: DENY
        PAID_FALLBACK: DENY
        TRIAL_CREDIT: DENY
      run: node private-v1-verifier/scripts/wolf-night-shift-wakeup.mjs reconcile
  night-shift-admission:
    needs: factory-source-admission
    if: github.event.repository.private == false && github.repository == 'insidethemarginmedia-cpu/wolf-factory-home' && github.actor == 'insidethemarginmedia-cpu' && ((inputs.night_shift == true && inputs.v1_terminal_request == '' && ((github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/public-runtime-probe-20261022'))) || (inputs.v1_terminal_request != '' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/omega-acceptance-ready-20261028' && inputs.night_shift != true && inputs.verify_cross_job_ab != true && inputs.execute_integrated != true && inputs.verify_runner_loss != true))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
    outputs:
      ready: ${{ steps.reserve.outputs.ready == 'true' && steps.quota.outcome == 'success' }}
      operational_outcome: ${{ steps.operational_skip.outputs.operational_outcome || steps.terminal.outputs.operational_outcome || (steps.quota.conclusion == 'success' && 'MISSION_WORK_ADMITTED' || 'OPERATIONAL_OUTCOME_UNDETERMINED') }}
    env:
      WOLF_FACTORY_EXPECTED_SHA: ${{ needs.factory-source-admission.outputs.source_sha }}
      WOLF_FACTORY_ACCEPTANCE_TRANSPORT: direct-service
      GROQ_FREE_PLAN_CONFIRMED: 'true'
      WOLF_FACTORY_RUNTIME_ROOT: ${{ inputs.v1_terminal_request != '' && format('/tmp/wolf-v1-disposition-{0}', github.run_id) || format('/tmp/wolf-integrated-{0}', github.run_id) }}
      WOLF_FACTORY_ACCEPTANCE_MANIFEST: /tmp/wolf-manifest-${{ github.run_id }}.json
      EUR_SPEND: '0'
      COST_UNKNOWN: DENY
      PAID_FALLBACK: DENY
      TRIAL_CREDIT: DENY
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: donraposo1-source/project-wolf
        ref: ${{ needs.factory-source-admission.outputs.source_sha }}
        token: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
        persist-credentials: false
        fetch-depth: 1
    - name: Reserve one durable wakeup without external mission effects
      if: inputs.v1_terminal_request == ''
      id: reserve
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: node scripts/wolf-night-shift-wakeup.mjs prepare
    - name: Publish only a separately approved V1 terminal disposition
      if: inputs.v1_terminal_request != ''
      id: terminal
      env:
        GITHUB_TOKEN: ${{ github.token }}
        WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
        WOLF_TERMINAL_REQUEST_JSON: ${{ inputs.v1_terminal_request }}
        WOLF_V1_DISPOSITION_REQUEST: ${{ runner.temp }}/wolf-v1-request.json
      run: |
        node --input-type=module <<'NODE'
        import fs from 'node:fs';
        const raw=process.env.WOLF_TERMINAL_REQUEST_JSON;
        if(typeof raw!=='string'||Buffer.byteLength(raw)>16384)throw Error('TERMINAL_REQUEST_LIMIT');
        fs.writeFileSync(process.env.WOLF_V1_DISPOSITION_REQUEST,JSON.stringify(JSON.parse(raw)),{flag:'wx',mode:0o600});
        NODE
        node scripts/wolf-night-shift-wakeup.mjs publish-terminal-disposition
        echo 'operational_outcome=V1_TERMINAL_DISPOSITION_ONLY' >> "$GITHUB_OUTPUT"
    - name: Record explicit operational skip without mission work
      if: inputs.v1_terminal_request == '' && steps.reserve.outputs.ready != 'true'
      id: operational_skip
      env:
        RESERVE_READY: ${{ steps.reserve.outputs.ready }}
      run: |
        set -euo pipefail
        outcome='NO_MISSION_WORK_PERFORMED'
        {
          echo '### Wolf wakeup operational outcome: NO_MISSION_WORK_PERFORMED'
          echo ''
          echo "The reservation gate returned ready=${RESERVE_READY:-<empty>}. The quota gate and every"
          echo 'mission job were skipped, so this run performed no mission work.'
          echo ''
          echo 'This run is NOT autonomous acceptance. No mission executed, no external effect was'
          echo 'created and no lease was released or replayed by this step.'
          echo ''
          echo "WOLF_WAKEUP_OPERATIONAL_OUTCOME=${outcome}"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "operational_outcome=${outcome}" >> "$GITHUB_OUTPUT"
        echo "WOLF_WAKEUP_OPERATIONAL_OUTCOME=${outcome}"
    - name: Admit one bounded direct Groq Free attempt without OpenRouter quota dependency
      id: quota
      if: steps.reserve.outputs.ready == 'true'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: node scripts/wolf-night-shift-wakeup.mjs quota
    - name: Persist safe suspension after bounded gate failure
      if: failure() && steps.reserve.outputs.ready == 'true'
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: node scripts/wolf-night-shift-wakeup.mjs suspend
  security-tests:
    needs: [night-shift-admission, factory-source-admission]
    if: always() && github.repository == 'insidethemarginmedia-cpu/wolf-factory-home' && github.actor == 'insidethemarginmedia-cpu' && (inputs.night_shift != true || needs.night-shift-admission.outputs.ready == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ inputs.night_shift == true && needs.factory-source-admission.outputs.public_runtime_sha || github.sha }}
      - run: node --test tests/*.test.mjs
  dbos-runtime:
    needs: security-tests
    if: always() && needs.security-tests.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.verify_dbos_runtime == true && github.repository == 'insidethemarginmedia-cpu/wolf-factory-home' && (github.ref == 'refs/heads/feat/public-runtime-probe-20261022' || github.ref == 'refs/heads/fix/omega-acceptance-ready-20261028') && github.actor == 'insidethemarginmedia-cpu'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dbos
          POSTGRES_DB: wolf_factory_dbos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wolf_factory_dbos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DBOS_SHA: 3f36908f58fd8b3079cbf5372203c7a2d0ba06cc
      WOLF_DBOS_SYSTEM_DATABASE_URL: postgresql://postgres:dbos@localhost:5432/wolf_factory_dbos
      WOLF_DBOS_FIXTURE_ROOT: /tmp/wolf-factory-dbos-e2e
      WOLF_DBOS_SDK_ENTRYPOINT: /tmp/dbos/dist/src/index.js
      EUR_SPEND: '0'
      COST_UNKNOWN: DENY
      PAID_FALLBACK: DENY
      TRIAL_CREDIT: DENY
    steps:
      - name: Checkout private Factory at verified immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: donraposo1-source/project-wolf
          ref: ff0a29aae8179d9c4a0c57d5772ae58f282c5ea6
          token: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Assert immutable source and recovery fixture
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'ff0a29aae8179d9c4a0c57d5772ae58f282c5ea6'
          test -f scripts/wolf-dbos-outer-e2e.mjs
          test -f scripts/wolf-factory-boxxkite-acceptance.mjs
          test -z "$(git status --porcelain)"
          echo PRIVATE_FACTORY_DBOS_SOURCE_VERIFIED=YES
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install private Factory lockfile dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Checkout pinned DBOS SDK donor
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/dbos-inc/dbos-transact-ts.git /tmp/dbos
          git -C /tmp/dbos checkout --detach "$DBOS_SHA"
          test "$(git -C /tmp/dbos rev-parse HEAD)" = "$DBOS_SHA"
          grep -qi '^MIT License' /tmp/dbos/LICENSE
      - name: Build pinned DBOS SDK donor
        working-directory: /tmp/dbos
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          test -f dist/src/index.js
      - name: Validate private controller and publication safety contracts
        run: |
          set -euo pipefail
          node --check scripts/wolf-factory-boxxkite-acceptance.mjs
          node --check infra/worker-router/factory-service-transports.mjs
          node --test \
            infra/autonomy/engineering-commit-journal.test.mjs \
            infra/autonomy/verified-cycle-continuation.test.mjs \
            tests/wolf-authorized-git-publication.test.mjs \
            tests/wolf-boxxkite-service-transport.test.mjs \
            tests/wolf-dbos-mode-validation.test.mjs
          echo PRIVATE_CONTROLLER_SAFETY_CONTRACTS=PASS
      - name: DBOS prepare fixture
        run: node scripts/wolf-dbos-outer-e2e.mjs prepare
      - name: DBOS verified crash before verifier
        run: |
          set -euo pipefail
          set +e
          node scripts/wolf-dbos-outer-e2e.mjs crash > "$RUNNER_TEMP/wolf-dbos-crash.out" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 77
          test "$(cat "$WOLF_DBOS_FIXTURE_ROOT/effect.count")" = 1
          test ! -f "$WOLF_DBOS_FIXTURE_ROOT/verifier.count"
      - name: DBOS recover and controlled M2 restart
        run: |
          set -euo pipefail
          set +e
