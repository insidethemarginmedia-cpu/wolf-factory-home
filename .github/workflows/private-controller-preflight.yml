          git -C /tmp/dbos checkout --detach "$DBOS_SHA"
          test "$(git -C /tmp/dbos rev-parse HEAD)" = "$DBOS_SHA"
          grep -qi '^MIT License' /tmp/dbos/LICENSE
      - name: Build pinned DBOS SDK donor
        working-directory: /tmp/dbos
