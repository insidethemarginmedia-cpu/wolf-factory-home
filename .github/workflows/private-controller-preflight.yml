            const v=JSON.parse(fs.readFileSync(path.join(root,f),'utf8'));let evidence;
            if(f.endsWith('-provider.json'))evidence=v.map(r=>({generationId:r.generationId,model:r.model,costUsd:r.costUsd}));
            else if(f.endsWith('-remote.json'))evidence=v.map(r=>({jobId:r.jobId,sandboxId:r.sandboxId,passed:r.passed,exitCode:r.exitCode,sourceSha256:r.sourceSha256}));
            else if(f.endsWith('-verifiers.json'))evidence=v.map(r=>({receiptId:r.receiptId,localStatus:r.local?.status,remotePassed:r.remote?.passed}));
            else evidence=v;
            console.log('WOLF_PARTIAL_RECEIPT='+JSON.stringify({file:f,evidence}));
          }
          NODE
      - name: Remove ephemeral SSH publication files
        if: always() && ((inputs.execute_integrated == true && inputs.use_publication_deploy_key == true) || inputs.night_shift == true)
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';
          for(const name of ['wolf-publication-key','wolf-publication-known-hosts'])fs.rmSync(path.join(process.env.RUNNER_TEMP,name),{force:true});
          NODE

      - name: Destroy only this disposable Ollama container
        if: always() && (inputs.execute_integrated == true || inputs.night_shift == true)
        run: 'docker rm -f wolf-ollama 2>/dev/null || true
      
          '

  runner-loss-prepare:
