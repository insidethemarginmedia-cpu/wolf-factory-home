name: Private Controller Access Preflight
on:
  workflow_dispatch:
    inputs:
      verify_private_source:
        description: Verify private source authorization only, without fetching source
        type: boolean
        default: false
      verify_private_checkout:
        description: Read-only private checkout at pinned source SHA, no inference or publication
        type: boolean
        default: false
      qualify_worker:
        description: Run a bounded free inference qualification
        type: boolean
        default: false
  push:
    branches: [feat/public-runtime-probe-20261022]
    paths:
      - '.github/workflows/private-controller-preflight.yml'
      - 'scripts/private-controller-preflight.mjs'
      - 'scripts/private-source-authorization.mjs'
      - 'tests/private-source-authorization.test.mjs'
      - 'tests/private-controller-preflight.test.mjs'
      - 'scripts/existing-worker-qualification.mjs'
      - 'tests/existing-worker-qualification.test.mjs'
      - 'scripts/boxxkite-service-diagnostic.mjs'
      - 'tests/boxxkite-service-diagnostic.test.mjs'
permissions:
  contents: read
concurrency:
  group: private-controller-preflight
  cancel-in-progress: false
jobs:
  security-tests:
    if: github.repository == 'insidethemarginmedia-cpu/wolf-factory-home' && github.actor == 'insidethemarginmedia-cpu'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - run: node --test tests/*.test.mjs
  service-access:
    needs: security-tests
    if: github.repository == 'insidethemarginmedia-cpu/wolf-factory-home' && github.ref == 'refs/heads/feat/public-runtime-probe-20261022' && github.actor == 'insidethemarginmedia-cpu'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify OpenRouter authentication independently (no inference)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/private-controller-preflight.mjs --openrouter-auth-only
      - name: Verify GitHub token identity without private source access
        env:
          WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
        run: node scripts/private-controller-preflight.mjs --github-auth-only
      - name: Verify service access without inference or private checkout
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
        run: node scripts/private-controller-preflight.mjs
      - name: Verify private source archive authorization without downloading
        if: github.event_name == 'workflow_dispatch' && inputs.verify_private_source == true
        env:
          WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
          WOLF_FACTORY_EXPECTED_SHA: 3a5a4b71ad225e3c7946484776bca36d100a8a60
        run: node scripts/private-source-authorization.mjs
      - name: Checkout private Factory at approved immutable SHA (read only)
        if: github.event_name == 'workflow_dispatch' && inputs.verify_private_checkout == true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: donraposo1-source/project-wolf
          ref: 3a5a4b71ad225e3c7946484776bca36d100a8a60
          token: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
          path: private-factory
          persist-credentials: false
          fetch-depth: 1
      - name: Verify private checkout and controller entrypoint (no execution)
        if: github.event_name == 'workflow_dispatch' && inputs.verify_private_checkout == true
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-factory rev-parse HEAD)" = '3a5a4b71ad225e3c7946484776bca36d100a8a60'
          test -f private-factory/scripts/wolf-factory-boxxkite-acceptance.mjs
          test -f private-factory/infra/autonomy/authorized-git-publication.mjs
          test -f private-factory/infra/autonomy/engineering-commit-journal.mjs
          test -f private-factory/.github/workflows/factory-dbos-outer-e2e.yml
          test -z "$(git -C private-factory status --porcelain)"
          echo PRIVATE_FACTORY_CHECKOUT_VERIFIED=YES
      - name: Qualify existing private worker adapter with free inference
        if: github.event_name == 'workflow_dispatch' && inputs.qualify_worker == true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
        run: node scripts/existing-worker-qualification.mjs
      - name: Diagnose Boxxkite service access without sandbox creation
        env:
          WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
          BOXXKITE_API_KEY: ${{ secrets.BOXXKITE_API_KEY }}
        run: node scripts/boxxkite-service-diagnostic.mjs
