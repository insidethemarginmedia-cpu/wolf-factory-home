      OLLAMA_IMAGE_SHA256: 459985308d740b99071719baec2740a60f5b2b2d9b835c171991ae25690203da
      OLLAMA_MODEL_SHA256: 4ff64a7f502a08b7616edb8ca0a79eb1853fc363d842b7df4b46915d11a3fb09
      OLLAMA_MODEL: qwen2.5-coder:0.5b
