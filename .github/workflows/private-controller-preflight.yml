      WOLF_FACTORY_ACCEPTANCE_MANIFEST: ${{ inputs.verify_cross_job_ab == true && format('/tmp/wolf-cross-job-{0}/manifest.json', github.run_id) || format('/tmp/wolf-manifest-{0}.json', github.run_id) }}
