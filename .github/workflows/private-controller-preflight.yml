          grep WOLF_MISSION_A_DURABLE_BEFORE_RESTART "$RUNNER_TEMP/wolf-first.log"
          WOLF_RESIDENT_MODE=dbos-engineering node infra/autonomy/resident-entrypoint.mjs > "$RUNNER_TEMP/wolf-recovery.log" 2>&1 || { tail -c 8000 "$RUNNER_TEMP/wolf-recovery.log"; exit 1; }
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const root=process.env.WOLF_FACTORY_RUNTIME_ROOT;
          const final=JSON.parse(fs.readFileSync(path.join(root,'acceptance-final.json'),'utf8'));
          if(final.dbosStatus!=='SUCCESS'||final.evidence.length!==2||final.result.state!=='NEXT_READY_DRAINED'||!final.restartReceipt||final.restartReceipt.pid===final.controllerPid)throw Error('INTEGRATED_RESTART_ACCEPTANCE_FAILED');
          for(const p of final.evidence){if(!p.integratedReview||p.cycle.state!=='CYCLE_COMPLETED'||!p.durable?.checkpointId)throw Error('INTEGRATED_MISSION_EVIDENCE_REQUIRED');}
          console.log('WOLF_INTEGRATED_ACCEPTANCE='+JSON.stringify({workflowID:final.workflowID,restartReceipt:final.restartReceipt,controllerPid:final.controllerPid,result:final.result,missions:final.evidence.map(p=>({missionId:p.spec.taskId,flint:p.providerReceipts.map(r=>r.generationId),opencode:p.integratedReview.opencode,groq:p.integratedReview.groq,executor:p.remoteReceipts,checkpoint:p.durable,verification:p.verifierReceipts.map(v=>({receiptId:v.receiptId,local:v.local,remote:v.remote})),trace:p.trace}))}));
          NODE
      - name: Execute one KCT admitted bounded synthetic Factory self-repair
        if: inputs.night_shift == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BOXXKITE_API_KEY: ${{ secrets.BOXXKITE_API_KEY }}
        run: 'WOLF_RESIDENT_MODE=dbos-engineering node infra/autonomy/resident-entrypoint.mjs
      
          rm -f "$RUNNER_TEMP/wolf-publication-key" "$RUNNER_TEMP/wolf-publication-known-hosts"
      
          npm test
      
          npm run build
      
          node scripts/wolf-night-shift-wakeup.mjs finish'
      - name: Suspend after failed repair; never retry unknown external effects
