        const fs=require('fs'),path=require('path');const root=process.env.WOLF_FACTORY_RUNTIME_ROOT;
        const final=JSON.parse(fs.readFileSync(path.join(root,'acceptance-final.json'),'utf8')),admission=JSON.parse(fs.readFileSync(path.join(root,'runner-loss-admission.json'),'utf8')),fence=JSON.parse(fs.readFileSync(path.join(root,'kct-recovery.json'),'utf8')),recovery=JSON.parse(fs.readFileSync(path.join(root,'runner-recovery.json'),'utf8'));
