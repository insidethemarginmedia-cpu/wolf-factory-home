  service-access:
    needs: [security-tests, factory-source-admission, night-shift-admission]
    if: >-
      always() && needs.security-tests.result == 'success' &&
      (inputs.verify_private_regression != true || needs.factory-source-admission.result == 'success') &&
      github.repository == 'insidethemarginmedia-cpu/wolf-factory-home' && github.actor == 'insidethemarginmedia-cpu' &&
