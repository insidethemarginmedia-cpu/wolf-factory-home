        test "$first_head" != "$WOLF_FACTORY_EXPECTED_SHA"
        test "$(GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code origin refs/heads/feat/factory-real-worker-m1-20261006 | awk '{print $1}')" = "$first_head"
        FIRST_HEAD="$first_head" node <<'NODE'
        const fs=require('fs'),path=require('path');
        const lp=path.join(process.env.RUNNER_TEMP,'wolf-cas-lease.json');
        const cur=JSON.parse(fs.readFileSync(lp,'utf8')),fence=JSON.parse(fs.readFileSync(path.join(process.env.WOLF_FACTORY_RUNTIME_ROOT,'kct-recovery.json'),'utf8'));
        if(cur.admittedSha!==process.env.WOLF_FACTORY_EXPECTED_SHA||cur.pendingPublication?.candidateSha!==process.env.FIRST_HEAD||cur.pendingPublication?.leaseFence!==cur.leaseFence||!Number.isSafeInteger(fence.newFence)||fence.newFence<cur.leaseFence)throw Error('CAS_LEASE_STATE_MISMATCH');
        const {pendingPublication,...settled}=cur;
        fs.writeFileSync(lp,JSON.stringify({...settled,expectedRemoteSha:process.env.FIRST_HEAD,leaseFence:fence.newFence},null,2)+'\n',{mode:0o600});
        NODE
        WOLF_RESIDENT_MODE=dbos-engineering node infra/autonomy/resident-entrypoint.mjs > "$RUNNER_TEMP/wolf-duplicate.log" 2>&1 || { tail -c 6000 "$RUNNER_TEMP/wolf-duplicate.log"; exit 1; }
        test "$(git rev-parse HEAD)" = "$first_head"
        remote_head="$(GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code origin refs/heads/feat/factory-real-worker-m1-20261006 | awk '{print $1}')"
        test "$remote_head" = "$first_head"
        echo "WOLF_REMOTE_COMMIT_VERIFIED=$remote_head"
        node <<'NODE'
        const fs=require('fs'),path=require('path');const a=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'wolf-first-c-proof.json'),'utf8')),b=JSON.parse(fs.readFileSync(path.join(process.env.WOLF_FACTORY_RUNTIME_ROOT,'acceptance-final.json'),'utf8'));
        if(JSON.stringify(a.evidence)!==JSON.stringify(b.evidence)||b.evidence.length!==1||b.dbosStatus!=='SUCCESS')throw Error('DUPLICATE_WAKEUP_RECONCILIATION_FAILED');console.log('WOLF_DUPLICATE_WAKEUP=VERIFIED_NO_NEW_EFFECTS');
        NODE
    - name: Recover automatic Mission B, verify, and reject a fresh duplicate process
