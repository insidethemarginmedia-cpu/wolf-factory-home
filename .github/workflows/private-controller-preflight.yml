    steps:
      - name: Checkout private Factory at verified immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: donraposo1-source/project-wolf
          ref: ecde4dec84142d06c09e5e8a14128023bde28596
          token: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Assert immutable source and recovery fixture
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'ecde4dec84142d06c09e5e8a14128023bde28596'
          test -f scripts/wolf-dbos-outer-e2e.mjs
          test -f scripts/wolf-factory-boxxkite-acceptance.mjs
          test -z "$(git status --porcelain)"
          echo PRIVATE_FACTORY_DBOS_SOURCE_VERIFIED=YES
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
