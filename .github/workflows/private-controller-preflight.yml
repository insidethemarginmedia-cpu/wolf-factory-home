          npm run build --prefix "$RUNNER_TEMP/cezar"
          echo "WOLF_CEZAR_RUNNER=$RUNNER_TEMP/cezar/packages/cezar/dist/core/opencode-server-runner.js" >> "$GITHUB_ENV"
      - name: Reuse qualified pinned ephemeral Ollama for existing Factory review
        if: inputs.execute_integrated == true || inputs.night_shift == true
        continue-on-error: true # Ollama is advisory; failure must not block Flint/Groq or DBOS
        shell: bash
        run: "set -euo pipefail\ntest \"$(nproc)\" -ge 3\ntest \"$(free -b | awk '/^Mem:/ {print $2}')\" -ge 12884901888\ntimeout 180s docker pull \"\
          ollama/ollama@sha256:${OLLAMA_IMAGE_SHA256}\"\ndocker run -d --rm --name wolf-ollama --cpus=3 --memory=10g --pids-limit=256 --cap-drop=ALL\
          \ --security-opt=no-new-privileges -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_MAX_LOADED_MODELS=1 -p 127.0.0.1:11434:11434 \"ollama/ollama@sha256:${OLLAMA_IMAGE_SHA256}\"\
          \ serve\nready=0\nfor attempt in $(seq 1 30); do\n  if curl --fail --silent --max-time 2 http://127.0.0.1:11434/api/version >/dev/null; then\
          \ ready=1; break; fi\n  sleep 1\ndone\ntest \"$ready\" -eq 1\ntimeout 240s docker exec wolf-ollama ollama pull \"$OLLAMA_MODEL\"\nnode --input-type=module\
          \ <<'NODE'\nconst r=await fetch('http://127.0.0.1:11434/api/tags',{signal:AbortSignal.timeout(5000)});\nif(!r.ok)throw Error('OLLAMA_TAGS_UNAVAILABLE');\n\
          const d=await r.json(),m=d.models?.find(m=>m.name===process.env.OLLAMA_MODEL);\nif(!m||m.digest!==process.env.OLLAMA_MODEL_SHA256)throw\
          \ Error('OLLAMA_MODEL_DIGEST_MISMATCH');\nconsole.log('WOLF_OLLAMA_FACTORY_RUNTIME='+JSON.stringify({state:'QUALIFIED_LOCAL_RUNTIME_READY',model:m.name,modelDigest:m.digest,endpoint:'127.0.0.1:11434',inferencePerformed:false}));\n\
          NODE\n"
      - name: Prepare explicitly selected SSH publication credential
