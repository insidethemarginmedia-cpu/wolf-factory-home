          git merge-base --is-ancestor "$WOLF_FACTORY_EXPECTED_SHA" "$mission_a_sha"
          test "$mission_a_sha" != "$WOLF_FACTORY_EXPECTED_SHA"
          test "$(GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code origin refs/heads/feat/factory-real-worker-m1-20261006 | awk '{print $1}')" = "$mission_a_sha"
          MISSION_A_SHA="$mission_a_sha" node <<'NODE'
          const fs=require('fs'),path=require('path');
          const lp=path.join(process.env.RUNNER_TEMP,'wolf-cas-lease.json');
          const cur=JSON.parse(fs.readFileSync(lp,'utf8'));
          if(cur.admittedSha!==process.env.WOLF_FACTORY_EXPECTED_SHA||cur.pendingPublication?.candidateSha!==process.env.MISSION_A_SHA||cur.pendingPublication?.leaseFence!==cur.leaseFence)throw Error('CAS_LEASE_STATE_MISMATCH');
          const manifest=JSON.parse(fs.readFileSync(process.env.WOLF_FACTORY_ACCEPTANCE_MANIFEST,'utf8')),next=manifest.missions?.[1]?.taskId;
          if(cur.missionId!==manifest.missions?.[0]?.taskId||typeof next!=='string'||!/^\w[\w-]{0,69}$/.test(next)||next===cur.missionId)throw Error('LEASE_MISSION_IDENTITY_MISMATCH');
          const {pendingPublication,...settled}=cur;
          fs.writeFileSync(lp,JSON.stringify({...settled,expectedRemoteSha:process.env.MISSION_A_SHA,admittedSha:process.env.MISSION_A_SHA,missionId:next,leaseFence:1},null,2)+'\n',{mode:0o600});
          NODE
          mission_b_fence="$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/wolf-cas-lease.json","utf8")).leaseFence')"
          mission_b_id="$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP+"/wolf-cas-lease.json","utf8")).missionId')"
          WOLF_GIT_PUBLICATION_MISSION_ID="$mission_b_id" WOLF_GIT_PUBLICATION_FENCE="$mission_b_fence" WOLF_RESIDENT_MODE=dbos-engineering node infra/autonomy/resident-entrypoint.mjs > "$RUNNER_TEMP/wolf-recovery.log" 2>&1 || { tail -c 8000 "$RUNNER_TEMP/wolf-recovery.log"; exit 1; }
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const root=process.env.WOLF_FACTORY_RUNTIME_ROOT;
          const final=JSON.parse(fs.readFileSync(path.join(root,'acceptance-final.json'),'utf8'));
          if(final.dbosStatus!=='SUCCESS'||final.evidence.length!==2||final.result.state!=='NEXT_READY_DRAINED'||!final.restartReceipt||final.restartReceipt.pid===final.controllerPid)throw Error('INTEGRATED_RESTART_ACCEPTANCE_FAILED');
          for(const p of final.evidence){if(!p.integratedReview||p.cycle.state!=='CYCLE_COMPLETED'||!p.durable?.checkpointId)throw Error('INTEGRATED_MISSION_EVIDENCE_REQUIRED');}
          console.log('WOLF_INTEGRATED_ACCEPTANCE='+JSON.stringify({workflowID:final.workflowID,restartReceipt:final.restartReceipt,controllerPid:final.controllerPid,result:final.result,missions:final.evidence.map(p=>({missionId:p.spec.taskId,flint:p.providerReceipts.map(r=>r.generationId),opencode:p.integratedReview.opencode,groq:p.integratedReview.groq,executor:p.remoteReceipts,checkpoint:p.durable,verification:p.verifierReceipts.map(v=>({receiptId:v.receiptId,local:v.local,remote:v.remote})),trace:p.trace}))}));
          NODE
          local_head="$(git rev-parse --verify HEAD)"
          git merge-base --is-ancestor "$mission_a_sha" "$local_head"
          test "$local_head" != "$mission_a_sha"
          remote_head="$(GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code origin refs/heads/feat/factory-real-worker-m1-20261006 | awk '{print $1}')"
          test "$remote_head" = "$local_head"
          echo "WOLF_REMOTE_COMMIT_VERIFIED=$remote_head"
      - name: Execute one KCT admitted bounded synthetic Factory self-repair
        if: inputs.night_shift == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WOLF_FACTORY_REPO_TOKEN: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BOXXKITE_API_KEY: ${{ secrets.BOXXKITE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          WOLF_RESIDENT_MODE=dbos-engineering node infra/autonomy/resident-entrypoint.mjs
          local_head="$(git rev-parse --verify HEAD)"
          git merge-base --is-ancestor "$WOLF_FACTORY_EXPECTED_SHA" "$local_head"
          test "$local_head" != "$WOLF_FACTORY_EXPECTED_SHA"
          remote_head="$(GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code origin refs/heads/feat/factory-real-worker-m1-20261006 | awk '{print $1}')"
          test "$remote_head" = "$local_head"
          echo "WOLF_REMOTE_COMMIT_VERIFIED=$remote_head"
          rm -f "$RUNNER_TEMP/wolf-publication-key" "$RUNNER_TEMP/wolf-publication-known-hosts"
          npm test
          npm run build
          node scripts/wolf-night-shift-wakeup.mjs finish
      - name: Suspend after failed repair; never retry unknown external effects
        if: failure() && inputs.night_shift == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/wolf-night-shift-wakeup.mjs suspend
      - name: Read back bounded synthetic execution receipts
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const root=process.env.WOLF_FACTORY_RUNTIME_ROOT;if(!fs.existsSync(root))process.exit(0);
          for(const f of fs.readdirSync(root).filter(n=>/^(?:OMEGA_[ABC]_[0-9]+|WOLF_WAKEUP_MANUAL_[0-9]+|WOLF_WAKEUP_SCHEDULE_ACCEPTANCE_V[0-9]+)-(provider|integrated-review|remote|verifiers|cleanup)\.json$/.test(n))){
            const v=JSON.parse(fs.readFileSync(path.join(root,f),'utf8'));let evidence;
            if(f.endsWith('-provider.json'))evidence=v.map(r=>({generationId:r.generationId,model:r.model,costUsd:r.costUsd}));
            else if(f.endsWith('-remote.json'))evidence=v.map(r=>({jobId:r.jobId,sandboxId:r.sandboxId,passed:r.passed,exitCode:r.exitCode,sourceSha256:r.sourceSha256}));
            else if(f.endsWith('-verifiers.json'))evidence=v.map(r=>({receiptId:r.receiptId,localStatus:r.local?.status,remotePassed:r.remote?.passed}));
            else evidence=v;
            console.log('WOLF_PARTIAL_RECEIPT='+JSON.stringify({file:f,evidence}));
          }
          NODE
      - name: Remove ephemeral SSH publication files
        if: always() && (((inputs.execute_integrated == true || inputs.verify_cross_job_ab == true) && inputs.use_publication_deploy_key == true) || inputs.night_shift == true)
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';
          for(const name of ['wolf-publication-key','wolf-publication-known-hosts','wolf-cas-lease.json'])fs.rmSync(path.join(process.env.RUNNER_TEMP,name),{force:true});
          NODE

      - name: Destroy only this disposable Ollama container
        if: always() && (inputs.execute_integrated == true || inputs.night_shift == true || inputs.verify_cross_job_ab == true)
        run: 'docker rm -f wolf-ollama 2>/dev/null || true
      
          '

  runner-loss-prepare:
    needs: [security-tests, factory-source-admission]
    if: always() && needs.factory-source-admission.result == 'success' && needs.security-tests.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.verify_runner_loss == true && inputs.use_publication_deploy_key ==
      true && github.repository == 'insidethemarginmedia-cpu/wolf-factory-home' && (github.ref == 'refs/heads/feat/public-runtime-probe-20261022' || github.ref == 'refs/heads/fix/omega-acceptance-ready-20261028')
      && github.actor == 'insidethemarginmedia-cpu'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      snapshot_sha: ${{ steps.publish.outputs.snapshot_sha }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dbos
          POSTGRES_DB: wolf_factory_dbos
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d wolf_factory_dbos" --health-interval 5s --health-timeout 5s --health-retries
          10
    env:
      CEZAR_SHA: 1b13522dd3642a4ea8331629b3680838164d2a2e
      OPENCODE_VERSION_PIN: 1.18.34
      WOLF_FACTORY_CWD: ${{ github.workspace }}
      WOLF_FACTORY_RUNTIME_ROOT: /tmp/wolf-runner-loss-${{ github.run_id }}
      WOLF_FACTORY_ACCEPTANCE_MANIFEST: /tmp/wolf-runner-loss-${{ github.run_id }}/manifest.json
      WOLF_FACTORY_ACCEPTANCE_TRANSPORT: direct-service
      WOLF_FACTORY_EXPECTED_SHA: ${{ needs.factory-source-admission.outputs.source_sha }}
      GROQ_FREE_PLAN_CONFIRMED: 'true'
      DBOS_SHA: 3f36908f58fd8b3079cbf5372203c7a2d0ba06cc
      WOLF_DBOS_SYSTEM_DATABASE_URL: postgresql://postgres:dbos@localhost:5432/wolf_factory_dbos
      WOLF_DBOS_FIXTURE_ROOT: /tmp/wolf-factory-dbos-e2e
      WOLF_DBOS_SDK_ENTRYPOINT: /tmp/dbos/dist/src/index.js
      EUR_SPEND: '0'
      COST_UNKNOWN: DENY
      PAID_FALLBACK: DENY
      TRIAL_CREDIT: DENY
      WOLF_RUNNER_LOSS_TEST: '1'
    steps:
    - name: Checkout private Factory at verified immutable source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: donraposo1-source/project-wolf
        ref: ${{ needs.factory-source-admission.outputs.source_sha }}
        token: ${{ secrets.WOLF_FACTORY_REPO_TOKEN }}
        persist-credentials: false
        fetch-depth: 1
    - name: Assert immutable source and recovery fixture
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$WOLF_FACTORY_EXPECTED_SHA"
        test -f scripts/wolf-dbos-outer-e2e.mjs
        test -f scripts/wolf-factory-boxxkite-acceptance.mjs
        test -z "$(git status --porcelain)"
        echo PRIVATE_FACTORY_DBOS_SOURCE_VERIFIED=YES
    - name: Set up Node.js 22
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Install private Factory lockfile dependencies
      run: |-
        npm ci --ignore-scripts --no-audit --no-fund
    - name: Checkout pinned DBOS SDK donor
      run: |
        set -euo pipefail
        git clone --filter=blob:none https://github.com/dbos-inc/dbos-transact-ts.git /tmp/dbos
        git -C /tmp/dbos checkout --detach "$DBOS_SHA"
        test "$(git -C /tmp/dbos rev-parse HEAD)" = "$DBOS_SHA"
        grep -qi '^MIT License' /tmp/dbos/LICENSE
    - name: Build pinned DBOS SDK donor
      working-directory: /tmp/dbos
      run: |
        set -euo pipefail
        npm ci --ignore-scripts --no-audit --no-fund
        npm run build
        test -f dist/src/index.js
    - name: Validate private controller and publication safety contracts
      run: |
        set -euo pipefail
        node --check scripts/wolf-factory-boxxkite-acceptance.mjs
        node --check infra/worker-router/factory-service-transports.mjs
        node --test \
          infra/autonomy/engineering-commit-journal.test.mjs \
          infra/autonomy/verified-cycle-continuation.test.mjs \
          tests/wolf-authorized-git-publication.test.mjs \
          tests/wolf-boxxkite-service-transport.test.mjs \
          tests/wolf-dbos-mode-validation.test.mjs
        echo PRIVATE_CONTROLLER_SAFETY_CONTRACTS=PASS
    - name: Full private regression and build
      run: |
        npm ci --ignore-scripts --no-audit --no-fund --prefix infra/worker-router/mastra-runtime
        npm test
        node --test infra/worker-router/groq-opencode-admission.test.mjs
        npm run build
    - name: Preserve regression runtime residue outside the clean controller checkout
      shell: bash
      run: |
        set -euo pipefail
        git status --porcelain
        if test -d .continuity; then
          test -z "$(git ls-files -- .continuity)"
          test ! -e "$RUNNER_TEMP/wolf-regression-continuity"
